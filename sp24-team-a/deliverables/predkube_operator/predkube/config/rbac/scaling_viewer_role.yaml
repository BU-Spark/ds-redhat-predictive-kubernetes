# permissions for end users to view scalings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: scaling-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: predkube
    app.kubernetes.io/part-of: predkube
    app.kubernetes.io/managed-by: kustomize
  name: scaling-viewer-role
rules:
- apiGroups:
  - webapp.test.com
  resources:
  - scalings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - webapp.test.com
  resources:
  - scalings/status
  verbs:
  - get
